name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v0.24.2)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z, got: $tag" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Release tag does not exist: $tag" >&2
            echo "Create it explicitly first, for example: git tag $tag && git push origin $tag" >&2
            exit 1
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest

    outputs:
      version: ${{ steps.version.outputs.version }}

  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
